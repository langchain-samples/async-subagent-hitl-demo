[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "async-subagent-hitl-demo"
version = "0.1.0"
description = "Local Deep Agents demo for independently resuming an interrupted async subagent."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "deepagents==0.7.14",
  "langgraph-cli[inmem]==0.4.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/async_subagent_demo"]
